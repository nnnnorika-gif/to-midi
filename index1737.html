
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIFF → MIDI 変換</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
body{max-width:560px;margin:0 auto;padding:24px 16px;line-height:1.6}
h1{font-size:1.4rem}
button{font:inherit;padding:8px 18px;border-radius:8px;border:1px solid #2a7;background:#2a7;color:#fff;cursor:pointer}
#log{margin-top:16px;word-break:break-all}
small{opacity:.7}
</style>
</head>
<body>
<h1>AIFF → MIDI 変換</h1>
<p>GarageBandから書き出したAIFFに埋め込まれているMIDIを取り出します。</p>
<input type="file" id="files" name="files" multiple="multiple" accept=".aif,.aiff,.aifc">
<button onclick="convert2Midi()">変換</button>
<div id="log"></div>
<p><small>・1ファイルなら .mid を、複数ファイルなら MIDI.zip をダウンロードします。<br>
・処理はブラウザ内で行われ、ファイルは外部に送信されません。</small></p>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.1.5/dist/jszip.min.js"></script>
<script>
// AIFF内の "MThd"(MIDIの先頭)から、"CHS"で始まる目印(または構造上の終端)までを切り出す
function extractMidi(buf){
  var view = new DataView(buf);
  var length = view.byteLength, offset = 4, startpos = 0, endpos = length;
  while (offset < length - 4) {
    var marker = view.getUint32(offset, false);
    if (marker == 0x4D546864) { startpos = offset; }
    if (startpos > 0 && marker >= 0x43485300 && marker < 0x43485400) { endpos = offset; }
    offset += 1;
  }
  if (!startpos) return null;
  // MIDIのトラック長から終端が正しく数えられるなら、それを優先(余分なバイトを残さない)
  var p = startpos + 14, nt = startpos + 12 <= length ? view.getUint16(startpos + 10) : 0, ok = nt > 0;
  for (var t = 0; t < nt && ok; t++) {
    if (p + 8 > length || view.getUint32(p) != 0x4D54726B) { ok = false; break; }
    p += 8 + view.getUint32(p + 4);
  }
  var end = (ok && p <= length) ? p : Math.min(length, endpos + 3);
  return new Uint8Array(buf).slice(startpos, end);
}

function save(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function convert2Midi(){
  var files = document.getElementById('files').files, log = document.getElementById('log');
  log.textContent = '';
  if (!files.length) { log.textContent = 'AIFFファイルを選んでください'; return; }
  var results = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i], midi = extractMidi(await f.arrayBuffer()), row = document.createElement('div');
    if (midi) {
      results.push([f.name.replace(/\.[^.]+$/, '') + '.mid', midi]);
      row.textContent = '✔ ' + f.name + ': MIDIを取り出しました(' + midi.length + 'バイト)';
    } else {
      row.textContent = '✘ ' + f.name + ': 埋め込みMIDIが見つかりません';
    }
    log.appendChild(row);
  }
  if (results.length == 1) {
    save(new Blob([results[0][1]], {type: 'audio/midi'}), results[0][0]);
  } else if (results.length > 1) {
    if (typeof JSZip == 'undefined') { alert('zipライブラリを読み込めませんでした。1ファイルずつ変換してください'); return; }
    var zip = new JSZip();
    results.forEach(function(r){ zip.file(r[0], r[1]); });
    save(await zip.generateAsync({type: 'blob'}), 'MIDI.zip');
  }
}
</script>
</body>
</html>
